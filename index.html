<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Interactive Tall Grass Lab</title>
  <meta name="description" content="Top-down pixel-art tall grass that leans, tramples, rustles and hides your legs. Pure JS / Canvas, CPU only.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 15 4 6 6 15M7 15 8 2 10 15M11 15 12 7 13 15' fill='%2374b648'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="stage">
      <canvas id="game" width="400" height="225"></canvas>
      <canvas id="overlay"></canvas>
    </div>

    <header id="hud" class="panel">
      <h1>Interactive Tall Grass <span>Lab</span></h1>
      <p class="sub" data-i18n="sub">草むらを歩いてみよう — WASD / 矢印キー / クリック・タップで移動</p>
      <div class="toggles">
        <button data-flag="interact" data-key="G"><kbd>G</kbd><span data-i18n="interact">草の反応</span></button>
        <button data-flag="wade" data-key="C"><kbd>C</kbd><span data-i18n="wade">足元カット</span></button>
        <button data-flag="wind" data-key="V"><kbd>V</kbd><span data-i18n="wind">風</span></button>
        <button data-flag="fx" data-key="F"><kbd>F</kbd><span data-i18n="fx">光とエフェクト</span></button>
        <button data-flag="debug" data-key="B"><kbd>B</kbd><span data-i18n="debug">デバッグ表示</span></button>
        <button data-flag="magnify" data-key="M"><kbd>M</kbd><span data-i18n="magnify">拡大鏡</span></button>
        <button id="paramsBtn" data-key="P"><kbd>P</kbd><span data-i18n="params">パラメータ</span></button>
        <button id="langBtn">EN</button>
      </div>
    </header>

    <aside id="params" class="panel hidden"></aside>

    <footer id="stats" class="panel"></footer>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
